[project]
name = "omnicare-backend"
version = "0.1.0"
description = "OmniCare Financial customer assistant - backend API and GenAI agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.5.0",
    "langchain-google-genai>=4.3.0",
    "chromadb>=1.5.0",
    "httpx>=0.28.0",
    "langchain-openai>=1.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real LLM API; skipped unless GEMINI_API_KEY is set"]
addopts = "-m 'not live'"
